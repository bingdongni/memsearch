name: Indexed embedding regression

on:
  push:
    branches: ['ci/indexed-embeddings-20261107']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync --locked --python ${{ matrix.python }} --no-default-groups --group dev --extra mistral
      - name: Test embedding providers and indexing
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/test_embeddings_openai_order.py tests/test_embeddings_indexed.py
          tests/test_embed_batching.py tests/test_index_cleanup.py tests/test_core_encoding.py
      - name: Check style
        if: matrix.python == '3.12'
        run: |
          uv run --locked --no-sync ruff check src/ tests/
          uv run --locked --no-sync ruff format --check src/ tests/
